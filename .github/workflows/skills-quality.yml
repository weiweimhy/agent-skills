name: skills-quality

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate skills
        shell: pwsh
        run: ./scripts/validate-skills.ps1

      - name: Check note search against a temporary notebook
        shell: pwsh
        run: ./tibishu-notes/scripts/Test-Find-TibishuNotes.ps1

      - name: Check note front matter and Markdown validator
        shell: pwsh
        run: ./tibishu-notes/scripts/Test-Validate-TibishuNote.ps1

      - name: Check session handoff snapshot helper
        shell: pwsh
        run: ./session-handoff/scripts/Test-Get-HandoffSnapshot.ps1

      - name: Check deepdive note QA helper
        shell: pwsh
        run: ./tech-deepdive-note-workflow/scripts/Test-DeepdiveNoteQA.ps1


      - name: Verify the agent evaluation fixture
        run: python agent-evals/scripts/evaluate.py

      - name: Check evaluator scoring and compatibility
        run: python -m unittest discover -s agent-evals/tests

